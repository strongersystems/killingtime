[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "killingtime"
version = "0.17.3"
description = "Raid progress tracking and reporting for the guild Killing Time (Draenor EU), powered by Warcraft Logs, Raider.IO and Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "anthropic>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
kt = "killingtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["killingtime*"]

[tool.setuptools.package-data]
killingtime = ["data/*.json", "web/templates/*.html", "web/static/*", "web/static/vendor/*", "web/static/members/*/*", "web/static/site/*", "web/static/site/bosses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
